---
argument_specs:
  main:
    short_description: Install and configure sudo
    description:
      - Validates role inputs and configures sudo and sudoers settings.

    options:
      sudo_config_file_name:
        type: str
        required: true
        description:
          - Name of the sudoers drop-in file created under /etc/sudoers.d/.
          - Must contain only letters, numbers, and underscore.

      sudo_admin_group:
        type: str
        required: true
        description:
          - Administrative group that will be granted sudo access.
          - Must contain only letters, numbers, and underscore.

      sudo_admin_password_required:
        type: bool
        required: true
        description:
          - Whether members of the administrative group must enter a password when using sudo.

      sudo_log:
        type: str
        required: false
        description:
          - Optional path to the sudo log file.
          - When defined, the role configures a sudoers setting for file-based logging.

      sudo_default_parameters:
        type: list
        required: false
        elements: str
        description:
          - List of sudo Defaults directives to render into the main sudoers file.
