---
# Regular expression used to validate absolute filesystem paths.
sudo_path_regex: '^/'

# Reference mapping of common sudo-capable groups by distribution.
sudo_default_groups_map:
  default:
    - wheel
  Debian:
    - admin
    - sudo
  Ubuntu:
    - admin
    - sudo
  RedHat:
    - wheel
  Fedora:
    - wheel

sudo_default_groups: "{{ sudo_default_groups_map.get(ansible_facts['distribution'], sudo_default_groups_map['default']) }}"
