---
- name: Verify sudo role
  hosts: all
  gather_facts: true
  vars:
    sudo_verify_config_file_name: "{{ sudo_config_file_name | default('01_ansible') }}"
    sudo_verify_sudo_binary: /usr/bin/sudo
    sudo_verify_visudo_binary: /usr/sbin/visudo
    sudo_verify_main_sudoers_file: /etc/sudoers
    sudo_verify_sudoers_dropin_dir: /etc/sudoers.d

  tasks:
    - name: Check sudo binary exists
      ansible.builtin.stat:
        path: "{{ sudo_verify_sudo_binary }}"
      register: sudo_verify_binary
      failed_when: not sudo_verify_binary.stat.exists
      changed_when: false
      tags:
        - sudo
        - validate

    - name: Check visudo binary exists
      ansible.builtin.stat:
        path: "{{ sudo_verify_visudo_binary }}"
      register: sudo_verify_visudo
      failed_when: not sudo_verify_visudo.stat.exists
      changed_when: false
      tags:
        - sudo
        - validate

    - name: Validate main sudoers file
      ansible.builtin.command:
        argv:
          - "{{ sudo_verify_visudo_binary }}"
          - -cf
          - "{{ sudo_verify_main_sudoers_file }}"
      changed_when: false
      tags:
        - sudo
        - validate

    - name: Verify use_pty is enabled
      ansible.builtin.command:
        argv:
          - grep
          - -rPi
          - '^\h*Defaults\h+([^#\n\r]+,\h*)?use_pty\b'
          - "{{ sudo_verify_main_sudoers_file }}"
          - "{{ sudo_verify_sudoers_dropin_dir }}"
      changed_when: false
      tags:
        - sudo
        - validate

    - name: Verify !use_pty is absent
      ansible.builtin.command:
        argv:
          - grep
          - -rPi
          - '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b'
          - "{{ sudo_verify_main_sudoers_file }}"
          - "{{ sudo_verify_sudoers_dropin_dir }}"
      register: sudo_verify_not_use_pty
      changed_when: false
      failed_when: sudo_verify_not_use_pty.rc == 0
      tags:
        - sudo
        - validate

    - name: Verify role-managed sudoers drop-in exists
      ansible.builtin.stat:
        path: "{{ sudo_verify_sudoers_dropin_dir }}/{{ sudo_verify_config_file_name }}"
      register: sudo_verify_dropin
      failed_when: not sudo_verify_dropin.stat.exists
      changed_when: false
      tags:
        - sudo
        - validate

    - name: Validate role-managed sudoers drop-in
      ansible.builtin.command:
        argv:
          - "{{ sudo_verify_visudo_binary }}"
          - -cf
          - "{{ sudo_verify_sudoers_dropin_dir }}/{{ sudo_verify_config_file_name }}"
      changed_when: false
      tags:
        - sudo
        - validate
