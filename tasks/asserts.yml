---
# tasks/asserts.yml
#
# Purpose:
#   Extra validation that is not fully covered by meta/argument_specs.yml.
#
# Notes:
#   - Basic type/required validation should be handled by validate_argument_spec
#     using meta/argument_specs.yml.
#   - This file keeps only regex/content checks that are better expressed here.

- name: Ensure sudo_config_file_name is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - sudo_config_file_name is regex('^[a-zA-Z0-9_]+$')
    fail_msg: >-
      sudo_config_file_name must contain only letters, numbers, and underscore.
      Got: {{ sudo_config_file_name }}

- name: Ensure sudo_admin_group is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - sudo_admin_group is regex('^[a-zA-Z0-9_]+$')
    fail_msg: >-
      sudo_admin_group must contain only letters, numbers, and underscore.
      Got: {{ sudo_admin_group }}

- name: Check if sudo_log value is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - sudo_log is regex(pathre)
    fail_msg: >-
      Invalid sudo log path ({{ sudo_log }}).
  when: sudo_log is defined

- name: Validate sudo_default_parameters entries
  ansible.builtin.assert:
    quiet: true
    that:
      - item is string
    fail_msg: >-
      Each entry in sudo_default_parameters must be a string.
      Invalid entry: {{ item }}
  loop: "{{ sudo_default_parameters | default([]) }}"
  when:
    - sudo_default_parameters is defined
    - sudo_default_parameters | length > 0
