---
# tasks/sudo.yml
# Purpose:
#   Install and configure sudo in a CIS-aligned way.
#
# Notes:
#   - On Ubuntu 26.04+, sudo-rs is the default sudo provider.
#   - This role requires classic sudoers support for Defaults logfile=...
#   - Therefore, the role removes sudo-rs on Ubuntu 26.04+ and keeps classic sudo.

- name: Refresh apt cache on Debian-family systems
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.get('os_family', '') == 'Debian'

- name: Install sudo on Debian-family systems
  ansible.builtin.apt:
    name: sudo
    state: present
  when:
    - ansible_facts.get('os_family', '') == 'Debian'

- name: Remove sudo-rs on Ubuntu 26.04+ (role requires classic sudo for CIS logfile support)
  ansible.builtin.apt:
    name: sudo-rs
    state: absent
    purge: true
    autoremove: true
    update_cache: true
  when:
    - ansible_facts.get('distribution', '') == 'Ubuntu'
    - ansible_facts.get('distribution_version', '0') is version('26.04', '>=')

- name: Install sudo on non-Debian systems
  ansible.builtin.package:
    name: sudo
    state: present
  when:
    - ansible_facts.get('os_family', '') != 'Debian'

- name: Configure admin group sudo rule
  vars:
    sudo_admin_rule: >-
      %{{ sudo_admin_group }} ALL=(ALL:ALL)
      {{ 'NOPASSWD:' if not sudo_admin_password_required else '' }} ALL
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ sudo_config_file_name }}"
    regexp: "^%{{ sudo_admin_group }}\\s"
    line: "{{ sudo_admin_rule | regex_replace('\\s+', ' ') | trim }}"
    mode: '0440'
    create: true
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Deploy main sudoers file
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers
    backup: true
    owner: root
    group: root
    mode: '0440'
    force: true
    validate: /usr/sbin/visudo -cf %s

- name: Ensure sudo logfile file exists
  ansible.builtin.file:
    path: "{{ sudo_log }}"
    state: touch
    owner: root
    group: root
    mode: '0600'
  when: sudo_log is defined

- name: Ensure sudo logfile setting is configured
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ sudo_config_file_name }}"
    regexp: '^Defaults\\s+logfile='
    line: 'Defaults log_host, log_year, logfile={{ sudo_log }}'
    mode: '0440'
    create: true
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s
  when: sudo_log is defined
