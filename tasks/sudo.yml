---
- name: Refresh apt cache on Debian-family systems
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts['os_family'] == 'Debian'
  tags:
    - sudo
    - install

- name: Install sudo on Debian-family systems
  ansible.builtin.apt:
    name: sudo
    state: present
  when:
    - ansible_facts['os_family'] == 'Debian'
  tags:
    - sudo
    - install

- name: Install sudo on non-Debian systems
  ansible.builtin.package:
    name: sudo
    state: present
  when:
    - ansible_facts['os_family'] != 'Debian'
  tags:
    - sudo
    - install

- name: Configure admin group sudo rule
  vars:
    sudo_admin_rule: >-
      %{{ sudo_admin_group }} ALL=(ALL:ALL)
      {{ 'NOPASSWD:' if not sudo_admin_password_required else '' }} ALL
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ sudo_config_file_name }}"
    regexp: "^%{{ sudo_admin_group }}\\s"
    line: "{{ sudo_admin_rule | regex_replace('\\s+', ' ') | trim }}"
    mode: '0440'
    create: true
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s
  tags:
    - sudo
    - config

- name: Deploy main sudoers file
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers
    backup: true
    owner: root
    group: root
    mode: '0440'
    force: true
    validate: /usr/sbin/visudo -cf %s
  tags:
    - sudo
    - config

- name: Ensure sudo logfile file exists
  ansible.builtin.file:
    path: "{{ sudo_log }}"
    state: touch
    owner: root
    group: root
    mode: '0600'
    access_time: preserve
    modification_time: preserve
  when:
    - sudo_log is defined
    - sudo_log | length > 0
  tags:
    - sudo
    - config

- name: Ensure sudo logfile setting is configured
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ sudo_config_file_name }}"
    regexp: '^Defaults\s+log_host,\s*log_year,\s*logfile='
    line: 'Defaults log_host, log_year, logfile="{{ sudo_log }}"'
    mode: '0440'
    create: true
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s
  when:
    - sudo_log is defined
    - sudo_log | length > 0
  tags:
    - sudo
    - config
